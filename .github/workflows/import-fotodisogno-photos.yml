name: Import FotodiSogno photos
on:
  push:
    paths:
      - ".github/workflows/import-fotodisogno-photos.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download optimized gallery images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/2026/nature images/2026/travel
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-6460-81f5-a006-be6c491ac687/raw?se=2026-09-18T08%3A51%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=54298f62-e6fe-5141-aaef-17b6d9d42dc9&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T07%3A28%3A05Z&ske=2026-09-19T07%3A28%3A05Z&sks=b&skv=2026-02-06&sig=xR1wmiVVf67kQoD1Talzg/IFHIdsJbaWUZj%2BHPx2bTo%3D' -o images/2026/nature/DSC06964.avif
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-6354-8210-913b-0744d7b74d17/raw?se=2026-09-18T08%3A51%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=9a3f7776-0739-5770-a59a-09edda402257&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T08%3A34%3A46Z&ske=2026-09-19T08%3A34%3A46Z&sks=b&skv=2026-02-06&sig=Wa9tBFMMBZ/PT4KifXMSFToifKhpO4lVVE9%2BXQZ98Qc%3D' -o images/2026/nature/DSCF4656.avif
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7714-81f4-b178-d8eb7ed9f158/raw?se=2026-09-18T08%3A51%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=e7bb1dc0-5e95-5181-a115-3ba00b5b9df3&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T05%3A53%3A13Z&ske=2026-09-19T05%3A53%3A13Z&sks=b&skv=2026-02-06&sig=ERzmtqSmECfBBKanJuPFunEk2ZJIP/ykRdpdiYVzBRU%3D' -o images/2026/nature/A7409516.avif
