      - name: Commit imported photos
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-fotodisogno-photos.yml
          git config user.name "fotografie"
          git config user.email "73024247+Gingerek@users.noreply.github.com"
          git add images/2026 .github/workflows/import-fotodisogno-photos.yml
          git commit -m "Add 2026 FotodiSogno gallery photos"
          git push
