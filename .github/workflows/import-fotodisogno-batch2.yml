        run: |
          set -euo pipefail
          rm .github/workflows/import-fotodisogno-batch2.yml
          git config user.name "fotografie"
          git config user.email "73024247+Gingerek@users.noreply.github.com"
          git add images/2026 .github/workflows/import-fotodisogno-batch2.yml
          git commit -m "Add second 2026 FotodiSogno photo batch"
