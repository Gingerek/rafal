name: Import FotodiSogno photo batch 3
on:
  push:
    paths:
      - ".github/workflows/import-fotodisogno-batch3.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download optimized gallery images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/2026/travel
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-fb38-81f4-8821-fad5e079fec8/raw?se=2026-09-18T09%3A08%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=a3ca645e-665e-5275-8fe4-10351571bcdc&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T08%3A34%3A46Z&ske=2026-09-19T08%3A34%3A46Z&sks=b&skv=2026-02-06&sig=HQBt/ULEUcZoJRzBYWi4mB26Hj1YjpQ1t6MjAFRjWgQ%3D' -o images/2026/travel/DSCF4413.avif
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-ff10-81f4-b349-55c0882752e9/raw?se=2026-09-18T09%3A08%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=578482d3-a199-5ed0-8ca3-f615175ce026&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T07%3A28%3A00Z&ske=2026-09-19T07%3A28%3A00Z&sks=b&skv=2026-02-06&sig=F%2BTaGxN8Fdv4bgoHGFGhZoi3qhV1aZIxZYS/bIsGdPE%3D' -o images/2026/travel/A7408676.avif
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-77ac-81f4-8bd6-2dc19754ccec/raw?se=2026-09-18T09%3A08%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=d14d6727-5bd2-59bf-9a85-1379f9567dc8&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T07%3A28%3A03Z&ske=2026-09-19T07%3A28%3A03Z&sks=b&skv=2026-02-06&sig=KKgHJ7GsM9LOklU1GFdpgQw/eBHxeRkRrUGt/yh2m7E%3D' -o images/2026/travel/A7408782.avif
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-de80-81f4-9593-06157ca57f99/raw?se=2026-09-18T09%3A08%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=863227ed-6fcd-5dcb-9b08-bcb481fe62d9&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T06%3A13%3A10Z&ske=2026-09-19T06%3A13%3A10Z&sks=b&skv=2026-02-06&sig=hCFxl58sOWWy6Sh8/zfmZmsygYoFZPRH26NklwsSn20%3D' -o images/2026/travel/A7408381.avif
      - name: Commit imported photos
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-fotodisogno-batch3.yml
          git config user.name "fotografie"
          git config user.email "73024247+Gingerek@users.noreply.github.com"
          git add images/2026 .github/workflows/import-fotodisogno-batch3.yml
          git commit -m "Add third 2026 FotodiSogno photo batch"
          git push
