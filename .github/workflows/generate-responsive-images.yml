name: Generate responsive images

on:
  push:
    branches:
      - main
      - agent/professional-image-system
    paths:
      - "images/**"
      - "project-data.js"
      - "scripts/generate-responsive-images.py"
      - ".github/workflows/generate-responsive-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip image-build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --upgrade pillow pillow-avif-plugin

      - name: Generate responsive variants
        run: python scripts/generate-responsive-images.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/responsive responsive-image-data.js
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate responsive image variants [skip image-build]"
          git push
