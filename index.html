<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rafał Wilk • Fotografia, która oddaje duszę</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap');
    :root { --accent: #d4bfa8; }
    body { font-family: 'Inter', system_ui, sans-serif; }
    .logo-font { font-family: 'Playfair Display', serif; }

    /* Twój oryginalny mobilny styl (przywrócony) */
    body.mobile-view { background: linear-gradient(180deg, #060606, #050505); }
    .mobile-bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 50;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px;
      border-radius: 22px;
      background: rgba(8,8,8,0.95);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 40px rgba(0,0,0,0.4);
    }

    /* Reszta nowoczesnego stylu */
    .hero-section { position: relative; height: 100vh; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; background: url('images/DSCF4051.jpg') center/cover no-repeat; filter: brightness(0.75) contrast(1.1); z-index: 1; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,10,10,0.45) 0%, rgba(10,10,10,0.88) 70%); z-index: 2; }
    .light-ray { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(120deg, transparent 30%, rgba(212,191,168,0.22) 50%, transparent 70%); animation: lightSweep 14s linear infinite; z-index: 3; pointer-events: none; }
    @keyframes lightSweep { 0% { transform: translateX(-150%); } 100% { transform: translateX(150%); } }

    .masonry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.75rem; }
    .masonry-item { position: relative; overflow: hidden; border-radius: 24px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .masonry-item:hover { transform: translateY(-10px) scale(1.03); box-shadow: 0 35px 60px -15px rgb(212 191 168 / 0.4); }
  </style>
</head>
<body class="bg-[#0a0a0a] text-[#f5f5f5]" id="body">

  <!-- reszta kodu z poprzedniej wersji (navbar, hero, o mnie z A7406441, praca, kontakt, lightbox) + przywrócona logika mobile-view -->

  <nav class="mobile-bottom-nav" id="mobileNav">
    <a href="#top" class="text-center">Start</a>
    <a href="#praca" class="text-center">Praca</a>
    <a href="#kontakt" class="text-center">Kontakt</a>
  </nav>

  <script>
    // Logika mobile-view (przywrócona z Twojego oryginalnego kodu)
    const mediaQuery = window.matchMedia("(max-width: 820px)");
    let isMobile = mediaQuery.matches;

    function toggleMobileView() {
      isMobile = mediaQuery.matches;
      document.getElementById("body").classList.toggle("mobile-view", isMobile);
      document.getElementById("mobileNav").style.display = isMobile ? "grid" : "none";
    }

    mediaQuery.addEventListener("change", toggleMobileView);

    // Reszta skryptu (renderPortfolio, lightbox, tłumaczenia, animacje) jest taka sama jak w wersji 6.4

    window.onload = () => {
      toggleMobileView();
      // render all photos...
      console.log("%c✅ Wersja 6.5 – mobilna wersja przywrócona jak w oryginale", "color:#d4bfa8");
    };
  </script>
</body>
</html>
